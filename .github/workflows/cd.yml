on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy 
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

      - name: Build go
        run: ./scripts/buildprod.sh

      - name: setup-gcloud
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
        
      - name: Docker build
        run: gcloud builds submit --tag europe-north2-docker.pkg.dev/bootdev-project-505220/notely-ar-repo/notely .

      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image europe-north2-docker.pkg.dev/bootdev-project-505220/notely-ar-repo/notely:latest --region europe-north2 --allow-unauthenticated --project bootdev-project-505220 --max-instances=4
